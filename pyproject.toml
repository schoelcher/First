[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research"
version = "0.1.0"
description = "A CLI tool that scrapes the web to gather comprehensive equity research data using a stock ticker."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "yfinance>=0.2.31",
    "pandas>=2.1.0",
    "rich>=13.6.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
]

[project.scripts]
equity-research = "equity_research.cli:main"
travel-tasker = "equity_research.travel_tasker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
